<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GRACE - Church CRM for Growth, Relationships, Attendance, Community, and Engagement" />
    <title>GRACE - Church CRM</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#EE2B37" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GRACE" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Montserrat:wght@500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Set the dark/light class before first paint so there's no flash of
         the wrong theme while React mounts. Mirrors ThemeContext.tsx's v2
         default-to-dark logic exactly — keep the two in sync. -->
    <script>
      (function () {
        try {
          if (!localStorage.getItem('grace-theme-reset-v2')) {
            localStorage.setItem('grace-theme-reset-v2', '1');
            localStorage.setItem('grace-theme', 'dark');
            document.documentElement.classList.add('dark');
            return;
          }
          var saved = localStorage.getItem('grace-theme');
          if (saved === 'dark' || saved === null) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Blank-page guard. MUST stay inline in the HTML.
         The app is a module bundle at /assets/index-<hash>.js. If that script
         fails to load — the classic "a stale service worker serves an
         index.html pointing at an asset hash that no longer exists after a
         deploy" — React never mounts, #root stays empty, and the page is a
         permanent white screen. Critically, every in-app recovery path
         (ErrorBoundary, UpdatePrompt, the grace-build version check in
         main.tsx) is inside that same bundle, so none of them can run. This
         handler is the only code guaranteed to still execute.
         First failure  -> drop the service worker + caches and reload once.
         Second failure -> show a readable message instead of a blank page. -->
    <script>
      (function () {
        var FLAG = 'grace-blank-page-recovery';
        function alreadyTried() {
          try { return !!sessionStorage.getItem(FLAG); } catch (e) { return false; }
        }
        function markTried() {
          try { sessionStorage.setItem(FLAG, String(Date.now())); } catch (e) {}
        }
        function showFallback() {
          var root = document.getElementById('root');
          if (!root || root.children.length) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
            'font-family:Figtree,system-ui,sans-serif;background:#18181b;color:#e4e4e7;padding:24px">' +
            '<div style="max-width:380px;text-align:center">' +
            '<p style="font-size:16px;font-weight:600;margin:0 0 8px">This page didn\'t finish loading</p>' +
            '<p style="font-size:13px;color:#a1a1aa;line-height:1.5;margin:0 0 16px">' +
            'A new version was just released. Reloading should pick it up.</p>' +
            '<button onclick="location.reload(true)" style="padding:9px 18px;border:0;border-radius:8px;' +
            'background:#6366f1;color:#fff;font-size:14px;font-weight:600;cursor:pointer">Reload</button>' +
            '</div></div>';
        }
        function selfHeal() {
          if (alreadyTried()) { showFallback(); return; }
          markTried();
          var reload = function () { window.location.reload(); };
          try {
            var jobs = [];
            if ('serviceWorker' in navigator) {
              jobs.push(
                navigator.serviceWorker.getRegistrations()
                  .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
                  .catch(function () {})
              );
            }
            if (window.caches && window.caches.keys) {
              jobs.push(
                window.caches.keys()
                  .then(function (ks) { return Promise.all(ks.map(function (k) { return window.caches.delete(k); })); })
                  .catch(function () {})
              );
            }
            Promise.all(jobs).then(reload, reload);
          } catch (e) { reload(); }
        }
        // Resource errors don't bubble — listen in the capture phase.
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT' && typeof t.src === 'string' && t.src.indexOf('/assets/') !== -1) {
            selfHeal();
          }
        }, true);
        // Vite emits this when a lazily-imported chunk 404s after boot.
        window.addEventListener('vite:preloadError', function () { selfHeal(); });
        // Last resort: the bundle downloaded fine but the app never mounted
        // (a boot-time crash, e.g. missing config). Show the message — but
        // deliberately DO NOT reload here. A reload on a timer would cut off a
        // slow-but-succeeding load on a poor connection and could loop; the
        // reload path is reserved for a script that demonstrably failed.
        // Harmless if we're merely slow: showFallback() no-ops once anything
        // has rendered, and React replaces this markup if it mounts later.
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (root && root.children.length === 0) showFallback();
          }, 15000);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
